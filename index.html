<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mon budget</title>
  <meta name="theme-color" content="#F2F4F7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0D1321" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Budget">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css?v=5">
</head>
<body>
  <div id="ptr" aria-hidden="true">↓ Tire pour actualiser</div>
  <main id="view"></main>

  <nav class="tabbar" aria-label="Navigation">
    <button data-view="mois">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
      <span>Mois</span>
    </button>
    <button data-view="ops">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6.5h11M9 12h11M9 17.5h11M4.5 6.5h.01M4.5 12h.01M4.5 17.5h.01"/></svg>
      <span>Opérations</span>
    </button>
    <button class="add" data-act="add-tx" aria-label="Ajouter une opération">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button data-view="epargne">
      <svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="7" rx="7" ry="3"/><path d="M5 7v5c0 1.7 3.1 3 7 3s7-1.3 7-3V7M5 12v5c0 1.7 3.1 3 7 3s7-1.3 7-3v-5"/></svg>
      <span>Épargne</span>
    </button>
    <button data-view="prev">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 17l5-5 4 3.5 8-8"/><path d="M15 7.5h5.5V13"/></svg>
      <span>Prévisions</span>
    </button>
  </nav>

  <dialog id="sheet" class="sheet"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <input type="file" id="import-file" accept="application/json,.json" hidden>

  <script src="app.js?v=5"></script>
</body>
</html>
